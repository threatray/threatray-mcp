name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Build wheel + sdist
        run: |
          pip install uv build
          python -m build
          ls -la dist/

      - name: Upload built artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

      - name: Attest build provenance
        if: github.repository_visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} \
            dist/* \
            --title "${{ github.ref_name }}" \
            --generate-notes

  # Trusted-publishing to PyPI — runs only after the GH release exists, so
  # release notes are visible before the package goes live.
  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/threatray-mcp
    permissions:
      id-token: write
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      # Publish the exact artifacts the build job produced, attested
      # (attest-build-provenance) and attached to the GH release — do NOT
      # rebuild here, so the SLSA provenance covers what actually lands on PyPI.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # `uv publish` over `pypa/gh-action-pypi-publish`: that action is a Docker
      # action whose ghcr image is tagged by `github.action_ref`, so a
      # commit-SHA pin resolves to a non-existent image tag — incompatible with
      # the org "actions must be pinned to a full-length SHA" policy. uv has
      # built-in OIDC trusted publishing and setup-uv SHA-pins cleanly.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv publish --trusted-publishing always dist/*
